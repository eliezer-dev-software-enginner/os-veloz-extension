<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OS Veloz</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header>
      <span class="mark" aria-hidden="true">⚡</span>
      <div>
        <h1>OS Veloz</h1>
        <p>Preencha sua jornada em poucos segundos.</p>
      </div>
    </header>

    <form id="configuracao">
      <div class="row">
        <div>
          <label for="jornada">Jornada</label>
          <select id="jornada" name="jornada">
            <option value="9">9 horas (até 18:00)</option>
            <option value="8">8 horas (até 17:00)</option>
          </select>
        </div>
        <div>
          <label for="intervalo">Intervalo (ms)</label>
          <input id="intervalo" name="intervalo" type="number" value="500" min="50" max="10000" step="50" required>
        </div>
      </div>

      <div class="schedule" aria-label="Horários que serão preenchidos">
        <span>08:00 — 12:00</span>
        <i aria-hidden="true"></i>
        <span id="periodoTarde">13:00 — 18:00</span>
      </div>

      <div class="actions">
        <button id="salvar" type="button" class="secondary">Salvar configuração</button>
        <button id="preencher" type="submit" class="primary">Preencher períodos</button>
      </div>
      <p id="status" role="status" aria-live="polite"></p>
    </form>
  </main>
  <script src="popup.js"></script>
</body>
</html>
